# XcodeGen spec — generates RoadTrip.xcodeproj (a single multiplatform app
# target for iOS + macOS). Requires XcodeGen 2.38+.
#
#   brew install xcodegen
#   cd apple && xcodegen generate && open RoadTrip.xcodeproj
name: RoadTrip
options:
  bundleIdPrefix: com.roadtrip
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  RoadTrip:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: RoadTrip
    info:
      path: RoadTrip/Info.plist
      properties:
        CFBundleDisplayName: roadTrip
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Allow HTTP to localhost for talking to the dev backend.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadtrip.app
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
